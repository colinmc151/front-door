name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in *.js scripts/*.js slack-bot/*.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

      - name: Build portal
        run: npm run build

      - name: Check compiled portal
        run: node --check public/app.js
