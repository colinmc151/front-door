<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksome Hiring Hub</title>
<script defer src="/vendor/react.production.min.js"></script>
<script defer src="/vendor/react-dom.production.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --border: #e2e5ea; --border-light: #f0f1f3;
    --text: #1a1d23; --text-2: #5f6776; --text-3: #9ba3b0;
    --accent: #6b3fa0; --accent-bg: #f3eefa; --accent-hover: #5a3488;
    --warn: #b45309; --warn-bg: #fef3e2;
    --red: #dc2626; --red-bg: #fef2f2;
    --blue: #2563eb; --blue-bg: #eff6ff;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    --radius: 6px; --radius-lg: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Inputs */
  .input { font-family: var(--font); font-size: 13px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); outline: none; width: 100%; transition: border-color 0.15s; background: var(--surface); color: var(--text); }
  .input:focus { border-color: var(--accent); }
  .input-sm { padding: 6px 10px; font-size: 12px; }
  textarea.input { resize: vertical; min-height: 60px; }
  select.input { cursor: pointer; }

  /* Buttons */
  .btn { font-family: var(--font); font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-ghost { border: none; background: none; color: var(--text-2); }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }

  /* Chat */
  .chat-msg { display: flex; gap: 10px; max-width: 640px; }
  .chat-msg.user { flex-direction: row-reverse; margin-left: auto; }
  .chat-avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
  .chat-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
  .chat-msg.assistant .chat-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chat-msg.user .chat-bubble { background: #18181b; color: white; border-bottom-right-radius: 4px; }
  .chat-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chat-option { font-family: var(--font); font-size: 13px; font-weight: 500; padding: 8px 18px; border-radius: 20px; border: 1.5px solid #e2e5ea; background: white; color: #1a1d23; cursor: pointer; transition: all 0.2s; }
  .chat-option:hover { border-color: #6b3fa0; color: #6b3fa0; background: #f3eefa; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(107,63,160,0.12); }
  .chat-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .chat-msg.user .chat-time { text-align: right; }

  /* Route card */
  .route-card { padding: 14px 16px; border-radius: var(--radius-lg); border-left: 4px solid; margin-top: 8px; max-width: 500px; }
  .route-card.worksome { border-color: var(--accent); background: var(--accent-bg); }
  .route-card.vms { border-color: var(--warn); background: var(--warn-bg); }

  /* Typing indicator */
  @keyframes blink { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); display: inline-block; animation: blink 1.4s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  /* Stats cards */
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .stat-value { font-size: 28px; font-weight: 700; line-height: 1; }

  .stat-change { font-size: 12px; font-weight: 600; margin-top: 8px; }
  .stat-change.up { color: var(--accent); }
  .stat-change.down { color: var(--red); }

  /* Table */
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th { text-align: left; padding: 10px 12px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-3); border-bottom: 2px solid var(--border); }
  .table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
  .table tr:hover td { background: #fafbfc; }

  /* Badge */
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; display: inline-block; }
  .badge-green { background: var(--accent-bg); color: var(--accent); }
  .badge-orange { background: var(--warn-bg); color: var(--warn); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }

  .config-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; align-items: center; margin-bottom: 12px; }
  .config-label { font-size: 12px; font-weight: 500; color: var(--text-2); }

  @keyframes pulse {

    50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }

  /* GitHub Discovery */
  .gh-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; flex-shrink: 0; }
  .gh-header { padding: 14px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
  .gh-card { padding: 14px 16px; border-bottom: 1px solid var(--border-light); transition: background 0.15s; }
  .gh-card:hover { background: #fafbfc; }
  .gh-card:last-child { border-bottom: none; }
  .gh-score { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .gh-score.high { background: #dcfce7; color: #15803d; }
  .gh-score.medium { background: #fef3c7; color: #92400e; }
  .gh-score.low { background: #fee2e2; color: #991b1b; }

  .gh-tag.matched { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .gh-repo { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .gh-repo a { color: var(--blue); text-decoration: none; }
  .gh-repo a:hover { text-decoration: underline; }
  .gh-actions { display: flex; gap: 6px; margin-top: 10px; }
  .gh-badge-source { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #1b1f23; color: white; letter-spacing: 0.3px; }
  .gh-expand { cursor: pointer; user-select: none; }
  .gh-search-bar { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-light); flex-wrap: wrap; }
  .gh-empty { padding: 32px 16px; text-align: center; color: var(--text-3); font-size: 13px; }

  /* Worksome Talent Cards */
  .ws-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; flex-shrink: 0; }
  .ws-header { padding: 14px 16px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
  .ws-card { padding: 14px 16px; border-bottom: 1px solid var(--border-light); transition: background 0.15s; }
  .ws-card:hover { background: #fafbfc; }
  .ws-card:last-child { border-bottom: none; }
  .ws-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: white; letter-spacing: 0.3px; }
  .ws-rate { font-size: 11px; color: var(--text-2); font-weight: 500; }
  .ws-status { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .ws-status.available { background: #dcfce7; color: #15803d; }
  .ws-status.hired { background: #fef3c7; color: #92400e; }
  .ws-score { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .ws-score.high { background: #dcfce7; color: #15803d; }
  .ws-score.medium { background: #fef3c7; color: #92400e; }
  .ws-score.low { background: #fee2e2; color: #991b1b; }
  .ws-tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; margin: 2px 3px 2px 0; background: #f1f5f9; color: var(--text-2); }
  .ws-tag.matched { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .ws-tag.company { background: #ede9fe; color: #6d28d9; font-weight: 600; border: 1px solid #c4b5fd; }
  .ws-breakdown-bar { height: 4px; border-radius: 2px; background: #e5e7eb; overflow: hidden; flex: 1; }
  .ws-breakdown-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .ws-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .ws-avatar { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; object-fit: cover; background: #e5e7eb; }
  .ws-avatar-placeholder { width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0; background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--accent); }

  /* ═══ MOBILE ═══ */
  @media (max-width: 768px) {
    .left-panel { display: none !important; }
    .chat-right { padding: 0 !important; }
    .chat-card { max-width: 100% !important; width: 100% !important; height: 100vh !important; max-height: 100vh !important; border-radius: 0 !important; box-shadow: none !important; border: none !important; }
    .chat-msg { max-width: 90%; }
    .chat-bubble { font-size: 15px; }
    .chat-option { font-size: 14px; padding: 10px 16px; }
    .stats-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    .charts-grid { grid-template-columns: 1fr !important; }
    .analytics-wrap { padding: 16px !important; }
    .config-wrap { padding: 16px !important; }

    .nav-bar { padding: 0 12px !important; }

    .table-wrap { overflow-x: auto; }

  }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ══════════════════════════════════════
// CONFIG STATE
// ══════════════════════════════════════
const defaultConfig = {
  client_name: 'Worksome',
  assistant_name: 'Worksome Hiring Hub',
  branding: { logo_text: 'W', primary_color: '#1a1d23', greeting: "Hi! I'm here to help you find the right talent. Let's get started.", logo_url: '', hero_image_url: '', headline: '', subheadline: '' },
  vms: { name: 'Beeline', url: 'https://beeline.com', api_type: 'REST' },
  worksome_url: 'https://sandbox.worksome.com/login',
  worksome_talent_pool_url: 'https://sandbox.worksome.com/contacts',
  weights: { deliverable_or_ongoing: 3, duration: 2, headcount: 2, payment_model: 1, sdc: 1 },
  knockouts: {
    vms: ['agency', 'staffing firm', 'temp workers', 'temps'],
    worksome: ['freelancer', 'independent consultant', 'sow', 'statement of work', 'fixed bid', 'milestone payment']
  },
  approval_gates: [{ condition: 'spend > 100000', action: 'procurement_review' }],
  education: {
    policies: [
      { title: 'Classification before engagement', body: 'Every contractor must have a completed status assessment before work begins. For UK engagements, this means an IR35 determination (PSC) or employment status analysis (sole trader). For US engagements, federal and state classification review is required. Worksome handles this as part of onboarding — no contractor may start without it.' },
      { title: 'Contract and practice must align', body: 'The way you work with a contractor must match what the contract says. Do not include contractors in performance reviews, employee benefits, bonus schemes, or equity plans. Do not direct their daily schedule or provide company equipment. If the scope of work materially changes, a status reassessment is triggered automatically in Worksome.' },
      { title: 'Misclassification risk', body: 'Getting classification wrong can result in backdated tax, penalties, and employment claims. In the UK, failure to exercise "reasonable care" on IR35 transfers tax liability to your company. In the US, states like California apply strict ABC tests where the worker is presumed to be an employee unless specific conditions are met. Worksome manages this risk — but your working practices need to support the classification.' },
      { title: 'Long-term engagement reviews', body: 'Engagements that run for extended periods are subject to periodic reassessment. The longer a contractor works with you, the higher the risk of employment status drift. Worksome tracks engagement duration and flags reviews automatically. If you need ongoing support beyond 12 months, discuss renewal with your procurement team.' },
      { title: 'When to use each channel', body: 'Use Worksome for independent contractors, freelancers, and consultants engaged on defined projects or deliverables. Use Beeline for temporary staff augmentation, agency workers, and roles where you manage day-to-day work directly. If in doubt, this intake tool will route you to the right place.' },
    ],
    guides: [
      { title: 'Writing a great project brief', body: 'Be specific about deliverables, not just skills. Instead of "need a designer," say "redesign our checkout flow to improve mobile conversion." Include timeline, budget range, and whether the work is remote or on-site. A clear brief leads to better talent matches and faster onboarding.' },
      { title: 'Working with contractors safely', body: 'Treat contractors as independent partners, not employees. Define outcomes and deliverables rather than dictating hours or methods. Do not include them in team stand-ups as mandatory attendees or put them on internal org charts. Keep supervision consistent with independent status — this protects both you and the contractor.' },
      { title: 'Onboarding a freelancer', body: 'Once routed through Worksome, the contract, compliance checks, and payments are handled for you. Your part: provide a clear project brief, grant access to necessary tools or repos, schedule a kickoff meeting, and assign a primary point of contact on your team.' },
      { title: 'How the intake process works', body: 'Describe what you need in plain language. The system asks a few quick questions to understand the type of work, then routes you to the right platform and creates a draft engagement. The whole process takes under 2 minutes. You can also use the AI project brief feature to search your talent pool for the best match.' },
    ],
  },
};

// ══════════════════════════════════════
// LIVE ANALYTICS (from the server audit log)
// ══════════════════════════════════════
function useAnalytics() {
  const [stats, setStats] = useState(null);
  useEffect(() => {
    fetch('/api/analytics', { headers: apiHeaders() })
      .then(r => r.ok ? r.json() : null)
      .then(s => { if (s) setStats(s); })
      .catch(() => {});
  }, []);
  return stats;
}

// ══════════════════════════════════════
// API HELPERS (auth + assistant call)
// ══════════════════════════════════════
// Auth is handled by an HttpOnly session cookie issued by the server
// when the page loads — sent automatically on same-origin requests.
function apiHeaders(extra = {}) {
  return { 'Content-Type': 'application/json', ...extra };
}

// Set when a conversation starts — lets the server compute intake duration
let _conversationStartedAt = null;

// Returns { text, intakeId } — intakeId is present once the server has
// recorded a completed routing decision in the audit log.
async function callAssistant(messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify({
      messages: messages.map(m => ({ role: m.role, content: m.text })),
      started_at: _conversationStartedAt,
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `API error: ${res.status}`);
  }
  const data = await res.json();
  return { text: data.text, intakeId: data.intakeId || null, approval: data.approval || null };
}

// Streaming variant — renders progressively via onDelta; falls back to
// the non-streaming endpoint if a stream can't be established.
async function callAssistantStream(messages, onDelta) {
  let res;
  try {
    res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify({
        messages: messages.map(m => ({ role: m.role, content: m.text })),
        started_at: _conversationStartedAt,
      })
    });
  } catch { return callAssistant(messages); }
  if (!res.ok || !res.body) return callAssistant(messages);

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '', acc = '', final = null, streamError = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const events = buf.split('\n\n');
    buf = events.pop();
    for (const ev of events) {
      const line = ev.trim();
      if (!line.startsWith('data:')) continue;
      let obj = null;
      try { obj = JSON.parse(line.slice(5)); } catch { continue; }
      if (obj.error) streamError = obj.error;
      if (obj.delta) { acc += obj.delta; if (onDelta) onDelta(acc); }
      if (obj.done) final = obj;
    }
  }
  if (streamError && !final) throw new Error(streamError);
  if (final) return { text: final.text, intakeId: final.intakeId || null, approval: final.approval || null };
  return { text: acc, intakeId: null, approval: null };
}

// Hide routing JSON / search markers while text is still streaming
function visibleStreamText(t) {
  return t.split('```json')[0].split('[TALENT_SEARCH')[0];
}

// ══════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════
function App() {
  const [page, setPage] = useState('chat');
  const [config, setConfig] = useState(defaultConfig);
  const [configDirty, setConfigDirty] = useState(false);
  const [configStatus, setConfigStatus] = useState(null); // 'saving' | 'saved' | 'error'

  // Server-side config is the source of truth — load it on start
  useEffect(() => {
    fetch('/api/config', { headers: apiHeaders() })
      .then(r => r.ok ? r.json() : null)
      .then(serverCfg => { if (serverCfg) setConfig(prev => ({...prev, ...serverCfg})); })
      .catch(() => {}); // fall back to defaults if unreachable
  }, []);

  const updateConfig = useCallback((updates) => {
    setConfig(prev => ({...prev, ...updates}));
    setConfigDirty(true);
    setConfigStatus(null);
  }, []);

  const saveConfig = useCallback(async (cfg) => {
    setConfigStatus('saving');
    try {
      const res = await fetch('/api/config', { method: 'PUT', headers: apiHeaders(), body: JSON.stringify(cfg) });
      if (!res.ok) throw new Error('save failed');
      const saved = await res.json();
      setConfig(prev => ({...prev, ...saved}));
      setConfigDirty(false);
      setConfigStatus('saved');
    } catch {
      setConfigStatus('error');
    }
  }, []);

  const accentStyle = { '--accent': config.branding.primary_color, '--accent-bg': config.branding.primary_color + '18', '--accent-hover': config.branding.primary_color + 'dd' };

  return (
    <div style={{...accentStyle, height: '100vh', display: 'flex', flexDirection: 'column'}}>
      {page === 'chat' ? (
        <ChatPage config={config} setPage={setPage} page={page} />
      ) : (
        <>
          <Nav page={page} setPage={setPage} config={config} />
          <div style={{flex: 1, overflow: 'hidden'}}>
            {page === 'config' && <ConfigPage config={config} updateConfig={updateConfig} saveConfig={saveConfig} configDirty={configDirty} configStatus={configStatus} />}
            {page === 'analytics' && <AnalyticsPage config={config} />}
          </div>
        </>
      )}
    </div>
  );
}

// ══════════════════════════════════════
// NAV
// ══════════════════════════════════════
function Nav({ page, setPage, config }) {
  const tabs = [
    { id: 'chat', label: 'Intake', icon: '💬' },
    { id: 'analytics', label: 'Analytics', icon: '📊' },
    { id: 'config', label: 'Settings', icon: '⚙️' }
  ];
  return (
    <div className="nav-bar" style={{background: 'var(--surface)', borderBottom: '1px solid var(--border)', padding: '0 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 52}}>
      <div style={{display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer'}} onClick={() => setPage('chat')}>
        <div style={{width: 30, height: 30, background: config.branding.primary_color, borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: 'white', fontWeight: 700}}>
          {config.branding.logo_text}
        </div>
        <span style={{fontSize: 15, fontWeight: 600}}>{config.assistant_name}</span>
      </div>
      <div className="nav-tabs" style={{display: 'flex', gap: 2}}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setPage(t.id)}
            style={{fontFamily: 'var(--font)', fontSize: 13, fontWeight: 500, padding: '6px 14px', border: 'none', borderRadius: 'var(--radius)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
              background: page === t.id ? 'var(--accent-bg)' : 'transparent',
              color: page === t.id ? 'var(--accent)' : 'var(--text-2)' }}>
            <span style={{fontSize: 14}}>{t.icon}</span> <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════
// QUICK-REPLY DETECTION
// ══════════════════════════════════════
function detectQuickReplies(text) {
  const t = text.toLowerCase();
  if (t.includes('already know who') || t.includes('know who you\'d like'))
    return ['Yes, I have someone in mind', 'No, I need to find someone'];
  if (t.includes('worked with') && (t.includes('before') || t.includes('through us')))
    return ['Yes, they\'ve worked with us before', 'No, they\'re new'];
  if ((t.includes('replacing someone') || t.includes('replace someone')) && (t.includes('project') || t.includes('specific')))
    return ['Replacing someone on my team', 'Coming in for a specific project'];
  if (t.includes('managing their day-to-day') || t.includes('managing this person') || t.includes('supervising their schedule') || t.includes('directing how'))
    return ['Yes, I\'ll manage them directly', 'No, they\'ll work independently'];
  if (t.includes('project brief') && (t.includes('ai') || t.includes('talent pool') || t.includes('best match')))
    return ['Yes, create a project brief', 'No, I\'ll just describe the role'];
  if ((t.includes('specific project') || t.includes('defined deliverable')) && (t.includes('ongoing support') || t.includes('ongoing')))
    return ['Specific project with a deliverable', 'Ongoing support for my team'];
  if (t.includes('prefer to pay') && (t.includes('deliverable') || t.includes('hourly')))
    return ['Pay for deliverables / milestones', 'Hourly or daily rate'];
  // Enrichment quick replies
  if ((t.includes('remote') && t.includes('on-site')) || (t.includes('remote') && t.includes('hybrid')))
    return ['Remote', 'On-site', 'Hybrid'];
  if (t.includes('budget') && t.includes('rate') && t.includes('mind'))
    return ['I have a budget in mind', 'No specific budget yet'];
  return null;
}

// CHAT PAGE (split layout)

function ChatPage({ config, setPage, page }) {
  const [messages, setMessages] = useState([]);
  const [apiMessages, setApiMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [routeResult, setRouteResult] = useState(null);
  const [handoffResult, setHandoffResult] = useState(null);
  const [handoffLoading, setHandoffLoading] = useState(false);
  const [started, setStarted] = useState(false);
  const [error, setError] = useState(null);
  const [quickReplies, setQuickReplies] = useState(null);
  const [waitingForWorkerName, setWaitingForWorkerName] = useState(false);
  const [foundWorkers, setFoundWorkers] = useState([]);
  const [listening, setListening] = useState(false);
  const [ghDiscovery, setGhDiscovery] = useState(null); // { criteria, sessionId } when active
  const [approvalGate, setApprovalGate] = useState(null); // { action, condition, approved? } when a gate fires
  const pendingHandoffRef = useRef(null); // handoff payload held until approval
  const chatRef = useRef(null);
  const inputRef = useRef(null);
  const recognitionRef = useRef(null);

  const scrollBottom = () => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; };

  const triggerHandoff = (payload) => {
    setHandoffLoading(true);
    fetch('/api/handoff/worksome', { method: 'POST', headers: apiHeaders(), body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(h => { setHandoffResult(h); setHandoffLoading(false); })
      .catch(() => setHandoffLoading(false));
  };

  const approveAndContinue = () => {
    setApprovalGate(g => g ? { ...g, approved: true } : g);
    if (pendingHandoffRef.current) {
      triggerHandoff(pendingHandoffRef.current);
      pendingHandoffRef.current = null;
    }
  };

  useEffect(() => { scrollBottom(); }, [messages, loading]);

  // Speech recognition setup
  const startListening = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) { alert('Speech recognition is not supported in this browser.'); return; }

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;
    recognitionRef.current = recognition;

    recognition.onstart = () => setListening(true);
    recognition.onresult = (e) => {
      const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
      setInput(transcript);
    };
    recognition.onend = () => { setListening(false); recognitionRef.current = null; };
    recognition.onerror = () => { setListening(false); recognitionRef.current = null; };

    recognition.start();
  };

  const stopListening = () => {
    if (recognitionRef.current) { recognitionRef.current.stop(); }
  };

  // Check if the last assistant message was asking for the worker's name
  const isAskingForName = (text) => {
    const t = text.toLowerCase();
    return t.includes("what's their name") || t.includes("what is their name") || t.includes("who is it") || t.includes("what's the person's name");
  };

  // Search Worksome talent pool by name
  const searchTalentPool = async (name) => {
    try {
      const res = await fetch(`/api/search-worker?name=${encodeURIComponent(name)}`, { headers: apiHeaders() });
      const data = await res.json();
      return data.workers || [];
    } catch { return []; }
  };

  // Search Worksome talent pool by skills
  const searchTalentPoolBySkills = async (skillsText) => {
    try {
      const res = await fetch(`/api/search-skills?skills=${encodeURIComponent(skillsText)}`, { headers: apiHeaders() });
      const data = await res.json();
      return data;
    } catch { return { workers: [], resolvedSkills: [] }; }
  };

  const sendToAssistant = async (userText, allApiMsgs) => {
    // API key is managed server-side
    setLoading(true);
    setError(null);
    setQuickReplies(null);

    let msgsToSend = allApiMsgs;

    // If we were waiting for a worker name, search the talent pool first
    if (waitingForWorkerName && userText) {
      setWaitingForWorkerName(false);
      const workers = await searchTalentPool(userText);

      // Inject search results: add an assistant "ack" then a user "system" message to maintain alternating roles
      if (workers.length > 0) {
        setFoundWorkers(workers); // Store for handoff
        const workerList = workers.map(w => `- ${w.name}${w.title ? ` (${w.title})` : ''} [ID: ${w.id}]`).join('\n');
        msgsToSend = [
          ...allApiMsgs,
          { role: 'assistant', text: `Let me check the talent pool for "${userText}"...` },
          { role: 'user', text: `[SYSTEM: Talent pool search results for "${userText}":\n${workerList}\nPresent these matches to the manager and ask them to confirm which worker. IMPORTANT: When outputting the final JSON, you MUST include the worker's ID exactly as shown above in the worker_id field.]` }
        ];
      } else {
        msgsToSend = [
          ...allApiMsgs,
          { role: 'assistant', text: `Let me check the talent pool for "${userText}"...` },
          { role: 'user', text: `[SYSTEM: Talent pool search for "${userText}" returned no results. Tell the manager you couldn't find them but you can get them set up. Ask for their first name to start collecting details (first name, last name, email, country, skills) — one question at a time.]` }
        ];
      }
    }

    try {
      // Stream the reply into a placeholder bubble for perceived speed
      setMessages(prev => [...prev, { role: 'assistant', text: '', time: new Date(), isStreamingMsg: true }]);
      const { text: reply, intakeId, approval: approvalInfo } = await callAssistantStream(msgsToSend, (acc) => {
        const visible = visibleStreamText(acc);
        setMessages(prev => prev.map(m => m.isStreamingMsg ? { ...m, text: visible } : m));
      });
      setMessages(prev => prev.filter(m => !m.isStreamingMsg));

      const jsonMatch = reply.match(/```json\s*([\s\S]*?)```/);
      let cleanReply = reply;
      if (jsonMatch) {
        cleanReply = reply.replace(/```json[\s\S]*?(?:```|$)/, '').trim();
        try {
          const parsed = JSON.parse(jsonMatch[1]);

          // Inject worker_id from search results if the model didn't include it
          if (parsed.known_worker && !parsed.worker_id && foundWorkers.length > 0) {
            // Try to match by name
            const match = foundWorkers.find(w =>
              parsed.worker_name && w.name && w.name.toLowerCase().includes(parsed.worker_name.toLowerCase())
            ) || foundWorkers[0];
            if (match) {
              parsed.worker_id = match.id;
              parsed.worker_email = parsed.worker_email || match.email;
              console.log('[Front Door] Injected worker_id from search:', match.id);
            }
          }

          setRouteResult(parsed);

          // Approval gate: hold the handoff until approved
          if (approvalInfo && approvalInfo.required) setApprovalGate(approvalInfo);

          // Trigger Worksome handoff if routed there
          if (parsed.route === 'worksome') {
            if (approvalInfo && approvalInfo.required) {
              pendingHandoffRef.current = {...parsed, _intakeId: intakeId};
            } else {
              triggerHandoff({...parsed, _intakeId: intakeId});
            }

            // Auto-search talent pool if skills are present and no TALENT_SEARCH marker
            const hasSearchMarker = reply.match(/\[TALENT_SEARCH:/);
            if (!hasSearchMarker && parsed.skills && parsed.skills.length > 0) {
              // Always trigger GitHub Discovery alongside Worksome search
              const ghCriteria = {
                skills: parsed.skills,
                languages: [],
                keywords: parsed.skills,
                location: parsed.location || null,
                roleTitle: parsed.role_title || ''
              };
              setGhDiscovery({ criteria: ghCriteria, sessionId: 'default' });

              try {
                setMessages(prev => [...prev, { role: 'assistant', text: '🔍 Searching your talent pool...', time: new Date(), isSearching: true }]);
                const result = await searchTalentPoolBySkills(parsed.skills.join(', '));
                const workers = result.workers || [];
                setMessages(prev => prev.filter(m => !m.isSearching));
                if (workers.length > 0) {
                  setFoundWorkers(workers);
                  console.log('[Front Door] Auto talent search found', workers.length, 'workers');
                }
              } catch (e) {
                setMessages(prev => prev.filter(m => !m.isSearching));
                console.log('[Front Door] Auto talent search error:', e);
              }
            }
          }
        } catch {}
      }

      // Check for [TALENT_SEARCH: ...] marker — auto-search talent pool
      const talentSearchMatch = reply.match(/\[TALENT_SEARCH:\s*([^\]]+)\]/);
      if (talentSearchMatch) {
        const skillsText = talentSearchMatch[1].trim();
        const displayReply = reply.replace(/\[TALENT_SEARCH:[^\]]+\]/, '').trim();

        // Show the project description part immediately
        setMessages(prev => [...prev, { role: 'assistant', text: displayReply, time: new Date() }]);
        // Add a searching indicator
        setMessages(prev => [...prev, { role: 'assistant', text: '🔍 Searching your talent pool...', time: new Date(), isSearching: true }]);

        // Search the talent pool by the extracted skills
        const result = await searchTalentPoolBySkills(skillsText);
        const workers = result.workers || [];
        const resolved = result.resolvedSkills || [];
        const skillSummary = resolved.map(s => s.name).join(', ') || skillsText;

        // Remove the searching indicator
        setMessages(prev => prev.filter(m => !m.isSearching));

        // Build the follow-up assistant call with results
        const updatedApiMsgs = [...msgsToSend, { role: 'assistant', text: reply }];
        let followUpMsgs;

        // Always trigger GitHub Discovery for external profiles
        const ghCriteria = {
          skills: resolved.map(s => s.name),
          languages: [],
          keywords: skillsText.split(',').map(s => s.trim()).filter(Boolean),
          location: null,
          roleTitle: ''
        };
        console.log('[Front Door] Setting ghDiscovery with criteria:', ghCriteria);
        setGhDiscovery({ criteria: ghCriteria, sessionId: 'default' });

        if (workers.length > 0) {
          setFoundWorkers(workers);
          const workerList = workers.map(w =>
            `- ${w.name}${w.title ? ` (${w.title})` : ''}${w.skills && w.skills.length > 0 ? ` | Skills: ${w.skills.join(', ')}` : ''} [ID: ${w.id}]`
          ).join('\n');
          followUpMsgs = [
            ...updatedApiMsgs,
            { role: 'user', text: `[SYSTEM: Talent pool search for skills "${skillSummary}" found these workers:\n${workerList}\n\nI've also opened a GitHub Discovery panel showing external technical profiles that match.\n\nScore each internal worker out of 10 based on how well their skills and title match the project requirements you just described. Present results as a ranked list with name, title, skills, score out of 10, and a brief reason. Mention that you've also found external GitHub profiles they can review in the panel below. Then ask if the manager wants to hire one of the internal matches or explore the external candidates. IMPORTANT: Include the worker's ID in worker_id in the final JSON if they pick someone.]` }
          ];
        } else {
          followUpMsgs = [
            ...updatedApiMsgs,
            { role: 'user', text: `[SYSTEM: Talent pool search for skills "${skillSummary}" found no matches in the internal pool. I've opened a GitHub Discovery panel showing external technical profiles that match. Tell the manager you didn't find anyone in their Worksome talent pool, but you've found some external GitHub profiles with relevant public work. They can review, shortlist, and draft an invite to bring them onto Worksome. Also offer to set up the role so they can find the right person through other channels. Continue to Path B2 Q3 onward — you already have the project description and skills.]` }
          ];
        }

        // Second assistant call with results (streamed)
        setMessages(prev => [...prev, { role: 'assistant', text: '', time: new Date(), isStreamingMsg: true }]);
        const { text: followUpReply, intakeId: followUpIntakeId, approval: followUpApproval } = await callAssistantStream(followUpMsgs, (acc) => {
          const visible = visibleStreamText(acc);
          setMessages(prev => prev.map(m => m.isStreamingMsg ? { ...m, text: visible } : m));
        });
        setMessages(prev => prev.filter(m => !m.isStreamingMsg));
        const followUpJson = followUpReply.match(/```json\s*([\s\S]*?)```/);
        let followUpClean = followUpReply;

        if (followUpJson) {
          followUpClean = followUpReply.replace(/```json[\s\S]*?(?:```|$)/, '').trim();
          try {
            const parsed = JSON.parse(followUpJson[1]);
            if (parsed.known_worker && !parsed.worker_id && foundWorkers.length > 0) {
              const match = foundWorkers.find(w =>
                parsed.worker_name && w.name && w.name.toLowerCase().includes(parsed.worker_name.toLowerCase())
              ) || foundWorkers[0];
              if (match) {
                parsed.worker_id = match.id;
                parsed.worker_email = parsed.worker_email || match.email;
              }
            }
            setRouteResult(parsed);
            if (followUpApproval && followUpApproval.required) setApprovalGate(followUpApproval);
            if (parsed.route === 'worksome') {
              if (followUpApproval && followUpApproval.required) {
                pendingHandoffRef.current = {...parsed, _intakeId: followUpIntakeId};
              } else {
                triggerHandoff({...parsed, _intakeId: followUpIntakeId});
              }
            }
          } catch {}
        }

        setMessages(prev => [...prev.filter(m => !m.isSearching), { role: 'assistant', text: followUpClean, time: new Date() }]);
        setApiMessages(prev => [...prev, { role: 'assistant', text: reply }, { role: 'user', text: followUpMsgs[followUpMsgs.length - 1].text }, { role: 'assistant', text: followUpReply }]);

        if (!followUpJson) {
          const qr = detectQuickReplies(followUpClean);
          if (qr) setQuickReplies(qr);
        }
      } else {
        // Normal flow — no talent search marker
        setMessages(prev => [...prev, { role: 'assistant', text: cleanReply, time: new Date() }]);
        setApiMessages(prev => [...prev, { role: 'assistant', text: reply }]);

        if (!jsonMatch) {
          const qr = detectQuickReplies(cleanReply);
          if (qr) setQuickReplies(qr);

          // Detect if the assistant is asking for the worker's name
          if (isAskingForName(cleanReply)) {
            setWaitingForWorkerName(true);
          }
        }
      }
    } catch (err) {
      setMessages(prev => prev.filter(m => !m.isStreamingMsg));
      setError(err.message);
    }
    setLoading(false);
  };

  const startConversation = () => {
    _conversationStartedAt = Date.now();
    setStarted(true);
    setMessages([]);
    setApiMessages([]);
    setRouteResult(null);
    setError(null);

    const greeting = config.branding.greeting;
    const firstQ = "\n\nDo you already know who you'd like to work with?";
    const fullMsg = greeting + firstQ;
    setMessages([{ role: 'assistant', text: fullMsg, time: new Date() }]);
    setApiMessages([{ role: 'assistant', text: fullMsg }]);
    setQuickReplies(['Yes, I have someone in mind', 'No, I need to find someone']);
  };

  const handleSend = (overrideText) => {
    const text = (overrideText || input).trim();
    if (!text || loading || routeResult) return;
    setInput('');
    setQuickReplies(null);
    const newUserMsg = { role: 'user', text, time: new Date() };
    const newApiMsgs = [...apiMessages, { role: 'user', text }];
    setMessages(prev => [...prev, newUserMsg]);
    setApiMessages(newApiMsgs);
    sendToAssistant(text, newApiMsgs);
  };

  const resetChat = () => { setStarted(false); setMessages([]); setApiMessages([]); setRouteResult(null); setHandoffResult(null); setHandoffLoading(false); setError(null); setQuickReplies(null); setWaitingForWorkerName(false); setListening(false); setFoundWorkers([]); setGhDiscovery(null); setApprovalGate(null); pendingHandoffRef.current = null; _conversationStartedAt = null; if (recognitionRef.current) recognitionRef.current.stop(); };

  const now = (d) => d ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';

  return (
    <div style={{height: '100vh', display: 'flex'}}>
      {/* Left branding panel */}
      <LeftPanel config={config} setPage={setPage} onLogoClick={resetChat} />

      {/* Right side — chat window floating on background */}
      <div className="chat-right" style={{flex: 1, background: '#f4f4f5', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 32}}>
        <div className="chat-card" style={{width: '100%', maxWidth: 480, height: '88vh', maxHeight: 660, background: 'white', borderRadius: 20, boxShadow: '0 12px 48px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.04)', display: 'flex', flexDirection: 'column', overflow: 'hidden', border: '1px solid rgba(0,0,0,0.06)'}}>

          {!started ? (
            <div className="chat-start" style={{flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 36px'}}>
              <div style={{textAlign: 'center'}}>
                <div style={{width: 48, height: 48, background: '#1a1d23', borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, color: 'white', fontWeight: 700, margin: '0 auto 16px'}}>
                  {config.branding.logo_text}
                </div>
                <h2 style={{fontSize: 20, fontWeight: 700, marginBottom: 8}}>{config.assistant_name}</h2>
                <p style={{fontSize: 14, color: 'var(--text-2)', marginBottom: 28, lineHeight: 1.6}}>
                  Describe what you need and we'll get you set up with the right team or platform.
                </p>
                <button className="btn" style={{fontSize: 14, padding: '11px 28px', background: '#1a1d23', color: 'white', border: 'none', borderRadius: 8}} onClick={startConversation}>
                  Start a new request
                </button>
              </div>
            </div>
          ) : (
            <>
              {/* Chat header */}
              <div style={{padding: '14px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0}}>
                <div style={{display: 'flex', alignItems: 'center', gap: 10}}>
                  <div style={{width: 26, height: 26, background: '#1a1d23', borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, color: 'white', fontWeight: 700, cursor: 'pointer'}} onClick={resetChat}>
                    {config.branding.logo_text}
                  </div>
                  <span style={{fontSize: 13, fontWeight: 600}}>
                    {routeResult ? `Routed → ${routeResult.route === 'worksome' ? 'Worksome' : config.vms.name}` : 'Intake in progress'}
                  </span>
                </div>
                <div style={{display: 'flex', gap: 4, alignItems: 'center'}}>
                  <button className="btn btn-sm btn-ghost" onClick={resetChat} style={{fontSize: 12}}>New</button>
                  <button className="btn btn-sm btn-ghost" onClick={() => setPage('analytics')} style={{fontSize: 12}}>📊</button>
                  <button className="btn btn-sm btn-ghost" onClick={() => setPage('config')} style={{fontSize: 12}}>⚙️</button>
                </div>
              </div>

              {/* Messages */}
              <div ref={chatRef} className="chat-messages" style={{flex: 1, overflowY: 'auto', padding: '18px 20px', display: 'flex', flexDirection: 'column', gap: 12}}>
                {messages.filter(m => !(m.isStreamingMsg && !m.text)).map((m, i) => (
                  <div key={i} className={`chat-msg ${m.role}`}>
                    <div className="chat-avatar" style={{background: m.role === 'assistant' ? '#1a1d23' : '#4a90d9', width: 28, height: 28, fontSize: 11}}>
                      {m.role === 'assistant' ? config.branding.logo_text : 'You'}
                    </div>
                    <div>
                      <div className="chat-bubble" style={{whiteSpace: 'pre-wrap'}}>{m.text}</div>
                      <div className="chat-time">{now(m.time)}</div>
                    </div>
                  </div>
                ))}

                {loading && !messages.some(m => m.isStreamingMsg && m.text) && (
                  <div className="chat-msg assistant">
                    <div className="chat-avatar" style={{background: '#1a1d23', width: 28, height: 28, fontSize: 11}}>{config.branding.logo_text}</div>
                    <div className="chat-bubble">
                      <span className="typing-dot"></span>{' '}
                      <span className="typing-dot"></span>{' '}
                      <span className="typing-dot"></span>
                    </div>
                  </div>
                )}

                {error && (
                  <div style={{background: 'var(--red-bg)', border: '1px solid var(--red)', borderRadius: 'var(--radius)', padding: '10px 14px', fontSize: 13, color: 'var(--red)'}}>
                    {error}
                  </div>
                )}

                {/* Worksome Talent Pool panel — inline after messages */}
                {foundWorkers.length > 0 && (
                  <WorksomeTalentPanel
                    workers={foundWorkers}
                    onHire={(worker) => {
                      // Simulate the user selecting this worker
                      handleSend(`I'd like to hire ${worker.name}`);
                    }}
                    onClose={() => setFoundWorkers([])}
                    routeResult={routeResult}
                  />
                )}

                {/* GitHub Discovery panel — inline after messages */}
                {ghDiscovery && (
                  <GitHubDiscoveryPanel
                    criteria={ghDiscovery.criteria}
                    sessionId={ghDiscovery.sessionId}
                    config={config}
                    onClose={() => setGhDiscovery(null)}
                  />
                )}

                {quickReplies && !loading && !routeResult && (
                  <div className="chat-options" style={{marginLeft: 38}}>
                    {quickReplies.map((qr, i) => (
                      <button key={i} className="chat-option" onClick={() => handleSend(qr)}>{qr}</button>
                    ))}
                  </div>
                )}

                {routeResult && (() => {
                  const isWorksome = routeResult.route === 'worksome';
                  const dest = isWorksome ? 'Worksome' : config.vms.name;
                  const color = isWorksome ? 'var(--accent)' : 'var(--warn)';

                  // Determine the best URL to link to
                  let destUrl = isWorksome ? config.worksome_url : config.vms.url;
                  if (isWorksome && handoffResult && handoffResult.job_url) {
                    destUrl = handoffResult.job_url;
                  }
                  // Worker not found but details collected — send to trusted contacts to invite
                  const isNewWorker = isWorksome && routeResult.worker_found === false && routeResult.worker_email;
                  // Worker not found and no details — fallback to talent pool
                  const isRedirect = isWorksome && routeResult.worker_found === false && !routeResult.worker_email;
                  if (isRedirect) {
                    destUrl = config.worksome_talent_pool_url || config.worksome_url;
                  }

                  return (
                    <div className={`route-card ${isWorksome ? 'worksome' : 'vms'}`}>
                      <div style={{fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.5, color, marginBottom: 4}}>
                        Routed → {dest}
                      </div>
                      <div style={{fontSize: 15, fontWeight: 600, marginBottom: 4}}>{routeResult.role_title || 'Role'}</div>
                      <div style={{fontSize: 13, color: 'var(--text-2)', marginBottom: 10, lineHeight: 1.5}}>
                        {isNewWorker ? (
                          `Click below to invite ${routeResult.worker_first_name || routeResult.worker_name || 'your worker'} ${routeResult.worker_last_name || ''} to the talent pool`
                        ) : isRedirect ? (
                          `Search the talent pool for ${routeResult.worker_name || 'your worker'}`
                        ) : (
                          <>Confidence: {routeResult.confidence} · {routeResult.known_worker ? 'Known worker' : 'Talent search'}{routeResult.headcount > 1 ? ` · ${routeResult.headcount} people` : ''}</>
                        )}
                      </div>

                      {isWorksome && handoffLoading && (
                        <div style={{fontSize: 12, color: 'var(--text-3)', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6}}>
                          <span className="typing-dot"></span>
                          <span className="typing-dot"></span>
                          <span className="typing-dot"></span>
                          <span style={{marginLeft: 4}}>Creating draft job in Worksome...</span>
                        </div>
                      )}

                      {isWorksome && handoffResult && handoffResult.job_id && (
                        <div style={{fontSize: 12, color: 'var(--accent)', marginBottom: 8}}>
                          Draft job created in Worksome (ID: {handoffResult.job_id})
                          {handoffResult.worker_invited && handoffResult.worker_name && (
                            <span> · {handoffResult.worker_name} invited to talent pool</span>
                          )}
                        </div>
                      )}

                      {!isWorksome && (
                        <BeelinePreview routeResult={routeResult} vmsName={config.vms.name} approvalGate={approvalGate} />
                      )}

                      {approvalGate && !approvalGate.approved ? (
                        <div style={{background: 'var(--warn-bg)', border: '1px solid var(--warn)', borderRadius: 'var(--radius)', padding: '10px 14px', marginTop: 10}}>
                          <div style={{fontSize: 12, fontWeight: 700, color: 'var(--warn)', marginBottom: 4}}>
                            ⏸ Approval required: {approvalGate.action.replace(/_/g, ' ')}
                          </div>
                          <div style={{fontSize: 11, color: 'var(--text-2)', marginBottom: 8}}>
                            Rule: {approvalGate.condition} — this request is on hold until approved.
                          </div>
                          <button className="btn btn-sm btn-primary" onClick={approveAndContinue}>
                            Approve & continue
                          </button>
                        </div>
                      ) : (
                        <a href={destUrl}
                          target="_blank" rel="noopener"
                          style={{display: 'inline-block', padding: '8px 18px', borderRadius: 'var(--radius)', fontSize: 13, fontWeight: 600, color: 'white', textDecoration: 'none', background: color, marginTop: 10}}>
                          {isRedirect ? 'Search talent pool →' : isNewWorker ? 'Invite to talent pool →' : `Continue in ${dest} →`}
                        </a>
                      )}
                    </div>
                  );
                })()}

              </div>

              {/* Input bar */}
              {!routeResult && (
                <div className="chat-input-bar" style={{padding: '12px 20px', borderTop: '1px solid var(--border)', display: 'flex', gap: 8, flexShrink: 0, alignItems: 'center'}}>
                  <button
                    onClick={listening ? stopListening : startListening}
                    disabled={loading}
                    title={listening ? 'Stop listening' : 'Voice input'}
                    style={{
                      width: 36, height: 36, borderRadius: '50%', border: 'none', cursor: 'pointer',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                      background: listening ? 'var(--red)' : 'var(--bg)',
                      color: listening ? 'white' : 'var(--text-2)',
                      transition: 'all 0.2s',
                      animation: listening ? 'pulse 1.5s ease-in-out infinite' : 'none',
                    }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                      <line x1="12" y1="19" x2="12" y2="23"/>
                      <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                  </button>
                  <input ref={inputRef} className="input" placeholder={listening ? 'Listening...' : 'Or type your answer...'} value={input}
                    onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSend()}
                    disabled={loading} style={{borderRadius: 8}} />
                  <button className="btn btn-primary" onClick={() => handleSend()} disabled={loading || !input.trim()} style={{borderRadius: 8}}>Send</button>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function ExternalTalentCard({ lead, onShortlist, onInvite, isShortlisted }) {
  const [expanded, setExpanded] = React.useState(false);
  const scoreClass = lead.fitScore >= 65 ? 'high' : lead.fitScore >= 40 ? 'medium' : 'low';
  const confidenceLabel = lead.confidenceScore >= 70 ? 'High' : lead.confidenceScore >= 45 ? 'Medium' : 'Low';

  const topRepos = (lead.relevantRepositories || []).slice(0, expanded ? 4 : 2);
  const allLangs = lead.topLanguages || [];
  const matchedSkills = lead.inferredSkills || [];

  return (
    <div className="gh-card">
      <div style={{display: 'flex', gap: 12, alignItems: 'flex-start'}}>
        {lead.avatarUrl && (
          <img src={lead.avatarUrl} alt="" style={{width: 40, height: 40, borderRadius: 8, flexShrink: 0}} />
        )}
        <div style={{flex: 1, minWidth: 0}}>
          <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'}}>
            <span style={{fontWeight: 600, fontSize: 14}}>{lead.displayName || lead.githubLogin}</span>
            <span className="gh-badge-source">GitHub</span>
            {lead.activityRecency && lead.activityRecency !== 'unknown' && (
              <span className="badge badge-green" style={{fontSize: 10}}>Active {lead.activityRecency.replace(/_/g, ' ')}</span>
            )}
          </div>
          <div style={{fontSize: 12, color: 'var(--text-3)', marginTop: 2}}>
            <a href={lead.githubProfileUrl} target="_blank" rel="noopener noreferrer" style={{color: 'var(--text-3)', textDecoration: 'none'}}>@{lead.githubLogin}</a>
            {lead.location && <span> &middot; {lead.location}</span>}
          </div>
          {lead.bio && <div style={{fontSize: 13, color: 'var(--text-2)', marginTop: 4, lineHeight: 1.4}}>{lead.bio.slice(0, 120)}{lead.bio.length > 120 ? '...' : ''}</div>}
        </div>

        <div className={`gh-score ${scoreClass}`} title={`Fit: ${lead.fitScore}/100`}>
          {lead.fitScore}
        </div>
      </div>

      {/* Languages & skills */}
      <div style={{marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 0}}>
        {matchedSkills.map(s => <span key={s} className="gh-tag matched">{s}</span>)}
        {allLangs.filter(l => !matchedSkills.map(s => s.toLowerCase()).includes(l.toLowerCase())).slice(0, 4).map(l => <span key={l} className="gh-tag">{l}</span>)}
      </div>

      {/* Top repos */}
      {topRepos.length > 0 && (
        <div style={{marginTop: 6}}>
          {topRepos.map(r => (
            <div key={r.name} className="gh-repo">
              <a href={r.url} target="_blank" rel="noopener noreferrer">{r.name.split('/').pop()}</a>
              {r.stars > 0 && <span> &middot; {r.stars} stars</span>}
              {r.language && <span> &middot; {r.language}</span>}
            </div>
          ))}
        </div>
      )}

      {/* Explanation & confidence */}
      <div style={{marginTop: 6, fontSize: 11, color: 'var(--text-3)'}}>
        {lead.fitExplanation} &middot; Confidence: {confidenceLabel} ({lead.confidenceScore}%)
      </div>

      {/* Expand toggle for breakdown */}
      {expanded && lead.fitBreakdown && (
        <div style={{marginTop: 8, padding: '8px 10px', background: 'var(--bg)', borderRadius: 'var(--radius)', fontSize: 11, color: 'var(--text-2)'}}>
          {Object.entries(lead.fitBreakdown).map(([key, val]) => (
            <div key={key} style={{display: 'flex', justifyContent: 'space-between', marginBottom: 2}}>
              <span>{key.replace(/([A-Z])/g, ' $1').trim()}</span>
              <span style={{fontWeight: 600}}>{val.weighted}/{Math.round(val.weight * 100)}</span>
            </div>
          ))}
        </div>
      )}

      {/* Actions */}
      <div className="gh-actions">
        <button
          className={`btn btn-sm ${isShortlisted ? 'btn-ghost' : 'btn-primary'}`}
          onClick={() => !isShortlisted && onShortlist(lead)}
          disabled={isShortlisted}
          style={isShortlisted ? {opacity: 0.7, cursor: 'default'} : {}}
        >
          {isShortlisted ? 'Shortlisted' : 'Shortlist'}
        </button>
        {isShortlisted && (
          <button className="btn btn-sm" onClick={() => onInvite(lead)}>
            Draft invite
          </button>
        )}
        <button className="btn btn-sm btn-ghost gh-expand" onClick={() => setExpanded(!expanded)} style={{marginLeft: 'auto'}}>
          {expanded ? 'Less' : 'More'}
        </button>
      </div>
    </div>
  );
}

function GitHubDiscoveryPanel({ criteria, sessionId, config, onClose }) {
  const [leads, setLeads] = React.useState([]);
  const [shortlist, setShortlist] = React.useState([]);
  const [searchLoading, setSearchLoading] = React.useState(false);
  const [searchError, setSearchError] = React.useState(null);
  const [searched, setSearched] = React.useState(false);
  const [tab, setTab] = React.useState('results'); // results | shortlist
  const [inviteModal, setInviteModal] = React.useState(null); // lead with draft
  const panelRef = React.useRef(null);

  // Scroll panel into view when it renders or when leads arrive
  React.useEffect(() => {
    if (panelRef.current) {
      setTimeout(() => panelRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    }
  }, [leads, searchLoading]);

  // Auto-search on mount if criteria provided
  React.useEffect(() => {
    console.log('[GitHubDiscovery] Panel mounted, criteria:', criteria);
    if (panelRef.current) {
      panelRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (criteria && (criteria.skills?.length || criteria.languages?.length || criteria.keywords?.length)) {
      console.log('[GitHubDiscovery] Auto-searching...');
      runSearch(criteria);
    }
  }, []);

  const runSearch = async (c) => {
    setSearchLoading(true);
    setSearchError(null);
    try {
      const params = new URLSearchParams();
      if (c.skills?.length) params.set('skills', c.skills.join(','));
      if (c.languages?.length) params.set('languages', c.languages.join(','));
      if (c.keywords?.length) params.set('keywords', c.keywords.join(','));
      if (c.location) params.set('location', c.location);
      params.set('maxResults', '3');

      const res = await fetch(`/api/github/search?${params}`, { headers: apiHeaders() });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Search failed');
      console.log('[GitHubDiscovery] Search returned', (data.leads || []).length, 'leads');
      setLeads(data.leads || []);
      setSearched(true);
    } catch (err) {
      console.error('[GitHubDiscovery] Search error:', err.message);
      setSearchError(err.message);
    }
    setSearchLoading(false);
  };

  const handleShortlist = async (lead) => {
    try {
      const res = await fetch('/api/github/shortlist', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({ sessionId: sessionId || 'default', lead })
      });
      const data = await res.json();
      setShortlist(data.shortlist || []);
    } catch (err) {
      console.error('Shortlist error:', err);
    }
  };

  const handleInvite = async (lead) => {
    try {
      const res = await fetch('/api/github/invite', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          sessionId: sessionId || 'default',
          githubLogin: lead.githubLogin,
          roleTitle: criteria?.roleTitle || 'a technical role',
          skills: lead.inferredSkills,
          clientName: config?.client_name || 'our team',
          senderName: ''
        })
      });
      const data = await res.json();
      setInviteModal({ lead, ...data });
    } catch (err) {
      console.error('Invite error:', err);
    }
  };

  const isShortlisted = (login) => shortlist.some(l => l.githubLogin === login);

  return (
    <div ref={panelRef} className="gh-panel" style={{marginTop: 12, maxWidth: 500}}>
      <div className="gh-header">
        <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
          <span style={{fontSize: 14, fontWeight: 600}}>GitHub Discovery</span>
          {searched && <span className="badge badge-blue">{leads.length} found</span>}
        </div>
        <div style={{display: 'flex', gap: 4}}>
          <button className={`btn btn-sm ${tab === 'results' ? '' : 'btn-ghost'}`} onClick={() => setTab('results')}>Results</button>
          <button className={`btn btn-sm ${tab === 'shortlist' ? '' : 'btn-ghost'}`} onClick={() => setTab('shortlist')}>
            Shortlist{shortlist.length > 0 ? ` (${shortlist.length})` : ''}
          </button>
          {onClose && <button className="btn btn-sm btn-ghost" onClick={onClose} title="Close">&times;</button>}
        </div>
      </div>

      {/* Search bar showing current criteria */}
      {criteria && (
        <div className="gh-search-bar">
          {criteria.skills?.map(s => <span key={s} className="gh-tag matched">{s}</span>)}
          {criteria.languages?.map(l => <span key={l} className="gh-tag">{l}</span>)}
          {criteria.location && <span className="gh-tag">{criteria.location}</span>}
        </div>
      )}

      {/* Loading */}
      {searchLoading && (
        <div className="gh-empty">
          <div style={{marginBottom: 8}}>Searching GitHub for talent...</div>
          <div style={{display: 'flex', justifyContent: 'center', gap: 4}}>
            <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
          </div>
        </div>
      )}

      {/* Error */}
      {searchError && (
        <div className="gh-empty" style={{color: 'var(--red)'}}>
          {searchError.includes('rate limit') ? 'GitHub rate limit reached. Please try again in a few minutes.' : `Search error: ${searchError}`}
        </div>
      )}

      {/* Results tab */}
      {!searchLoading && !searchError && tab === 'results' && (
        <>
          {leads.length === 0 && searched && (
            <div className="gh-empty">No matching profiles found. Try broader criteria.</div>
          )}
          {leads.map(lead => (
            <ExternalTalentCard
              key={lead.id}
              lead={lead}
              onShortlist={handleShortlist}
              onInvite={handleInvite}
              isShortlisted={isShortlisted(lead.githubLogin)}
            />
          ))}
        </>
      )}

      {/* Shortlist tab */}
      {tab === 'shortlist' && (
        <>
          {shortlist.length === 0 && (
            <div className="gh-empty">No one shortlisted yet. Browse results and shortlist candidates to compare.</div>
          )}
          {shortlist.map(lead => (
            <ExternalTalentCard
              key={lead.id}
              lead={lead}
              onShortlist={handleShortlist}
              onInvite={handleInvite}
              isShortlisted={true}
            />
          ))}
        </>
      )}

      {/* Invite draft modal */}
      {inviteModal && (
        <div style={{padding: 16, borderTop: '1px solid var(--border)', background: 'var(--accent-bg)'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
            <span style={{fontWeight: 600, fontSize: 13}}>Invite draft for @{inviteModal.lead.githubLogin}</span>
            <button className="btn btn-sm btn-ghost" onClick={() => setInviteModal(null)}>&times;</button>
          </div>
          <textarea
            className="input"
            rows={8}
            defaultValue={inviteModal.inviteMessage}
            style={{fontSize: 12, lineHeight: 1.5}}
          />
          <div style={{marginTop: 8, display: 'flex', gap: 8, alignItems: 'center'}}>
            <button className="btn btn-sm btn-primary" onClick={() => {
              navigator.clipboard.writeText(inviteModal.inviteMessage);
              setInviteModal(null);
            }}>Copy to clipboard</button>
            <span style={{fontSize: 11, color: 'var(--text-3)'}}>Review and personalise before sending</span>
          </div>
        </div>
      )}

      {/* Compliance footer */}
      <div style={{padding: '8px 16px', borderTop: '1px solid var(--border-light)', fontSize: 10, color: 'var(--text-3)', lineHeight: 1.4}}>
        External profiles from public GitHub data only. No contact info is shared until the candidate creates a Worksome profile.
      </div>
    </div>
  );
}
