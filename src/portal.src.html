function WorksomeTalentCard({ worker, onHire, selected, onToggleSelect }) {
  const [expanded, setExpanded] = React.useState(false);
  const scoreClass = worker.fitScore >= 65 ? 'high' : worker.fitScore >= 40 ? 'medium' : 'low';
  const initials = (worker.name || '?').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
  const matchedSkills = worker.fitBreakdown?.skillMatch?.reasons || [];

  return (
    <div className="ws-card" style={{border: selected ? '2px solid var(--accent)' : undefined, background: selected ? 'var(--accent-bg)' : undefined}}>
      <div style={{display: 'flex', gap: 12, alignItems: 'flex-start'}}>
        {/* Selection checkbox */}
        <div
          onClick={() => onToggleSelect && onToggleSelect(worker)}
          style={{
            width: 20, height: 20, borderRadius: 4, flexShrink: 0, cursor: 'pointer', marginTop: 2,
            border: selected ? '2px solid var(--accent)' : '2px solid var(--border)',
            background: selected ? 'var(--accent)' : 'var(--surface)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'all 0.15s',
          }}
          title={selected ? 'Deselect' : 'Select for job invite'}
        >
          {selected && <span style={{color: 'white', fontSize: 12, fontWeight: 700}}>✓</span>}
        </div>

        {worker.avatar ? (
          <img src={worker.avatar} alt="" className="ws-avatar" />
        ) : (
          <div className="ws-avatar-placeholder">{initials}</div>
        )}
        <div style={{flex: 1, minWidth: 0}}>
          <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'}}>
            <span style={{fontWeight: 600, fontSize: 14}}>{worker.name || 'Unknown'}</span>
            {worker.isCurrentlyHired ? (
              <span className="ws-status hired">On a hire</span>
            ) : worker.previouslyEngaged ? (
              <span className="ws-status available">Available</span>
            ) : null}
          </div>
          {worker.title && (
            <div style={{fontSize: 12, color: 'var(--text-2)', marginTop: 2}}>{worker.title}</div>
          )}
          <div style={{fontSize: 11, color: 'var(--text-3)', marginTop: 2, display: 'flex', gap: 8, flexWrap: 'wrap'}}>
            {worker.location && <span>{worker.location}</span>}
            {worker.dayRate && (
              <span className="ws-rate">{worker.currency || ''} {worker.dayRate}/day</span>
            )}
            {worker.previouslyEngaged && (
              <span>Previously engaged</span>
            )}
            {worker.hiresCount > 0 && (
              <span title={`${worker.hiresCount} previous hire(s)`}>{worker.hiresCount} hire{worker.hiresCount !== 1 ? 's' : ''}</span>
            )}
            {worker.notesCount > 0 && (
              <span title={`${worker.notesCount} internal note(s)`}>{worker.notesCount} note{worker.notesCount !== 1 ? 's' : ''}</span>
            )}
          </div>
          {worker.bio && (
            <div style={{fontSize: 12, color: 'var(--text-2)', marginTop: 4, lineHeight: 1.4}}>
              {worker.bio.slice(0, 140)}{worker.bio.length > 140 ? '...' : ''}
            </div>
          )}
        </div>

        <div className={`ws-score ${scoreClass}`} title={`Fit: ${worker.fitScore}/100`}>
          {worker.fitScore}
        </div>
      </div>

      {/* Skills */}
      {worker.skills && worker.skills.length > 0 && (
        <div style={{marginTop: 8, display: 'flex', flexWrap: 'wrap', gap: 0}}>
          {worker.skills.map(s => {
            const isCompany = (worker.companySkills || []).some(cs => cs.toLowerCase() === s.toLowerCase());
            const isMatched = matchedSkills.some(m => m.toLowerCase() === s.toLowerCase());
            return <span key={s} className={`ws-tag ${isCompany ? 'company' : isMatched ? 'matched' : ''}`} title={isCompany ? 'Added by your company' : ''}>{s}</span>;
          })}
        </div>
      )}

      {/* Fit explanation */}
      <div style={{marginTop: 6, fontSize: 11, color: 'var(--text-3)'}}>
        {worker.fitExplanation}
      </div>

      {/* Expanded breakdown */}
      {expanded && worker.fitBreakdown && (
        <div style={{marginTop: 8, padding: '8px 10px', background: 'var(--bg)', borderRadius: 'var(--radius)', fontSize: 11}}>
          {Object.entries(worker.fitBreakdown).map(([key, val]) => (
            <div key={key} style={{display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4}}>
              <span style={{width: 110, color: 'var(--text-3)', flexShrink: 0}}>{key.replace(/([A-Z])/g, ' $1').trim()}</span>
              <div className="ws-breakdown-bar">
                <div className="ws-breakdown-fill" style={{
                  width: `${val.score}%`,
                  background: val.score >= 65 ? '#22c55e' : val.score >= 40 ? '#f59e0b' : '#ef4444'
                }} />
              </div>
              <span style={{fontWeight: 600, color: 'var(--text-2)', width: 30, textAlign: 'right'}}>{val.weighted}</span>
            </div>
          ))}
        </div>
      )}

      {/* Hire history */}
      {expanded && worker.hires && worker.hires.length > 0 && (
        <div style={{marginTop: 8, padding: '8px 10px', background: 'var(--bg)', borderRadius: 'var(--radius)', fontSize: 11}}>
          <div style={{fontWeight: 600, marginBottom: 4, color: 'var(--text-2)'}}>Hire history</div>
          {worker.hires.map((h, i) => (
            <div key={h.id || i} style={{display: 'flex', gap: 8, alignItems: 'center', marginBottom: 3, flexWrap: 'wrap'}}>
              <span className={`ws-status ${h.status === 'ACTIVE' ? 'hired' : 'available'}`} style={{fontSize: 10}}>
                {h.status}
              </span>
              {h.contractType && <span style={{color: 'var(--text-3)'}}>{h.contractType}</span>}
              {h.rate && <span style={{fontWeight: 500}}>{h.currency || ''} {h.rate}/{h.rateType || 'day'}</span>}
              {h.startDate && (
                <span style={{color: 'var(--text-3)'}}>
                  {h.startDate}{h.endDate ? ` — ${h.endDate}` : ' — present'}
                </span>
              )}
              {h.tenure > 0 && <span style={{color: 'var(--text-3)'}}>({h.tenure}d)</span>}
            </div>
          ))}
        </div>
      )}

      {/* Actions */}
      <div className="ws-actions">
        <button
          className={`btn btn-sm ${selected ? 'btn-primary' : ''}`}
          onClick={() => onToggleSelect && onToggleSelect(worker)}
          style={selected ? {} : {border: '1px solid var(--accent)', color: 'var(--accent)'}}
        >
          {selected ? '✓ Selected' : 'Select'}
        </button>
        <button className="btn btn-sm btn-ghost" onClick={() => setExpanded(!expanded)} style={{marginLeft: 'auto'}}>
          {expanded ? 'Less' : 'Score details'}
        </button>
      </div>
    </div>
  );
}

function WorksomeTalentPanel({ workers, onHire, onClose, routeResult }) {
  const panelRef = React.useRef(null);
  const [selectedIds, setSelectedIds] = React.useState(new Set());
  const [inviteLoading, setInviteLoading] = React.useState(false);
  const [inviteResult, setInviteResult] = React.useState(null);

  React.useEffect(() => {
    if (panelRef.current) {
      panelRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, []);

  if (!workers || workers.length === 0) return null;

  const topScore = workers[0]?.fitScore || 0;
  const hasStrongMatch = topScore >= 40;
  const hasDecentMatch = topScore >= 25;

  const toggleSelect = (worker) => {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(worker.id)) {
        next.delete(worker.id);
      } else {
        next.add(worker.id);
      }
      return next;
    });
  };

  const selectAll = () => {
    if (selectedIds.size === workers.length) {
      setSelectedIds(new Set());
    } else {
      setSelectedIds(new Set(workers.map(w => w.id)));
    }
  };

  const handleCreateJobAndInvite = async () => {
    if (selectedIds.size === 0) return;
    setInviteLoading(true);
    try {
      const selectedWorkers = workers.filter(w => selectedIds.has(w.id));
      // Pull skills from route result, or extract from selected workers' skills
      const fallbackSkills = [...new Set(selectedWorkers.flatMap(w => w.skills || []))].slice(0, 5);
      const jobDetails = {
        role_title: routeResult?.role_title || 'New Role',
        description: routeResult?.description || '',
        skills: (routeResult?.skills && routeResult.skills.length > 0) ? routeResult.skills : fallbackSkills,
        duration: routeResult?.duration || '',
        location: routeResult?.location || 'remote',
        payment_model: routeResult?.payment_model || 'unknown',
        headcount: selectedWorkers.length,
      };
      const res = await fetch('/api/worksome/invite', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({
          jobDetails,
          workerIds: Array.from(selectedIds),
          workerNames: Object.fromEntries(selectedWorkers.map(w => [w.id, w.name])),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create job');
      setInviteResult(data);
      console.log('[Front Door] Job created and workers invited:', data);
    } catch (err) {
      console.error('[Front Door] Invite error:', err);
      setInviteResult({ error: err.message });
    }
    setInviteLoading(false);
  };

  return (
    <div className="ws-panel" ref={panelRef}>
      <div className="ws-header">
        <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
          <span style={{fontWeight: 700, fontSize: 14}}>Talent Pool Matches</span>
          <span className="ws-badge">{workers.length} found</span>
        </div>
        <div style={{display: 'flex', alignItems: 'center', gap: 6}}>
          <button className="btn btn-sm btn-ghost" onClick={selectAll} style={{fontSize: 11}}>
            {selectedIds.size === workers.length ? 'Deselect all' : 'Select all'}
          </button>
          {onClose && (
            <button className="btn btn-sm btn-ghost" onClick={onClose} style={{padding: '2px 6px'}}>&times;</button>
          )}
        </div>
      </div>

      {!hasStrongMatch && (
        <div style={{padding: '8px 16px', fontSize: 11, color: 'var(--text-3)', background: 'var(--bg)', borderBottom: '1px solid var(--border-light)', lineHeight: 1.4}}>
          {!hasDecentMatch
            ? "No close skill matches in your talent pool — showing the closest profiles available. Consider posting the role to attract new candidates."
            : "These are the closest matches from your talent pool. Scores reflect skill alignment with your requirements."}
        </div>
      )}

      {workers.map(w => (
        <WorksomeTalentCard
          key={w.id}
          worker={w}
          onHire={onHire}
          selected={selectedIds.has(w.id)}
          onToggleSelect={toggleSelect}
        />
      ))}

      {/* Selection action bar */}
      {selectedIds.size > 0 && !inviteResult && (
        <div style={{
          padding: '12px 16px', background: 'var(--accent-bg)', borderTop: '2px solid var(--accent)',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <span style={{fontSize: 13, fontWeight: 500, color: 'var(--accent)'}}>
            {selectedIds.size} worker{selectedIds.size !== 1 ? 's' : ''} selected
          </span>
          <button
            className="btn btn-sm btn-primary"
            onClick={handleCreateJobAndInvite}
            disabled={inviteLoading}
            style={{minWidth: 160}}
          >
            {inviteLoading ? 'Creating job...' : `Create Job & Invite ${selectedIds.size}`}
          </button>
        </div>
      )}

      {/* Invite result */}
      {inviteResult && !inviteResult.error && (
        <div style={{
          padding: '12px 16px', background: '#f0fdf4', borderTop: '2px solid #22c55e',
        }}>
          <div style={{fontSize: 14, fontWeight: 600, color: '#15803d', marginBottom: 6}}>
            ✓ Job created in Worksome
          </div>
          <div style={{fontSize: 12, color: '#166534', marginBottom: 8}}>
            {inviteResult.job_title} — {inviteResult.results?.length || 0} worker{(inviteResult.results?.length || 0) !== 1 ? 's' : ''} selected
          </div>
          {inviteResult.results && inviteResult.results.map(r => (
            <div key={r.workerId} style={{fontSize: 12, marginBottom: 3, display: 'flex', gap: 6, alignItems: 'center'}}>
              <span style={{width: 6, height: 6, borderRadius: '50%', flexShrink: 0, background: '#22c55e'}}></span>
              <span style={{fontWeight: 500}}>{r.workerName || r.workerId}</span>
            </div>
          ))}
          <div style={{marginTop: 10, display: 'flex', gap: 8}}>
            {inviteResult.job_url && (
              <a
                href={inviteResult.job_url}
                target="_blank"
                rel="noopener"
                className="btn btn-sm btn-primary"
                style={{textDecoration: 'none', display: 'inline-flex'}}
              >
                Open in Worksome →
              </a>
            )}
          </div>
        </div>
      )}

      {inviteResult && inviteResult.error && (
        <div style={{padding: '12px 16px', background: 'var(--red-bg)', borderTop: '2px solid var(--red)', fontSize: 12, color: 'var(--red)'}}>
          Error: {inviteResult.error}
          <button className="btn btn-sm" onClick={() => setInviteResult(null)} style={{marginLeft: 8}}>Retry</button>
        </div>
      )}

      <div style={{padding: '8px 16px', borderTop: '1px solid var(--border-light)', fontSize: 10, color: 'var(--text-3)', lineHeight: 1.4}}>
        Scored from your Worksome talent pool. Fit scores are based on skills, title, engagement history, availability, and profile completeness.
      </div>
    </div>
  );
}

// BEELINE REQUISITION PREVIEW
// ══════════════════════════════════════
function BeelinePreview({ routeResult, vmsName, approvalGate }) {
  const [req, setReq] = React.useState(null);
  const [showJson, setShowJson] = React.useState(false);

  React.useEffect(() => {
    fetch('/api/beeline/preview', {
      method: 'POST',
      headers: apiHeaders(),
      body: JSON.stringify({ ...routeResult, _approvalRequired: !!(approvalGate && !approvalGate.approved) })
    })
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.requisition) setReq(d.requisition); })
      .catch(() => {});
  }, []);

  if (!req) return null;

  const rows = [
    ['Type', req.requisitionType === 'SOW' ? 'Statement of Work' : 'Staff Augmentation'],
    ['Positions', req.numberOfPositions],
    ['Duration', req.estimatedDuration || '—'],
    ['Dates', req.endDate ? `${req.startDate} → ${req.endDate}` : (req.startDate || '—')],
    ['Rate type', req.rateType ? req.rateType.toLowerCase() : '—'],
    ['Remote allowed', req.location && req.location.remoteAllowed ? 'Yes' : 'No'],
    ['Approval', req.approvalStatus.replace(/_/g, ' ').toLowerCase()],
  ];

  return (
    <div style={{marginTop: 10, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 'var(--radius)', padding: '10px 12px'}}>
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6}}>
        <span style={{fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 0.4, color: 'var(--text-3)'}}>
          {vmsName} requisition preview
        </span>
        <button className="btn btn-ghost btn-sm" style={{fontSize: 11, padding: '2px 6px'}} onClick={() => setShowJson(!showJson)}>
          {showJson ? 'Summary' : 'JSON'}
        </button>
      </div>
      {showJson ? (
        <pre style={{fontSize: 10.5, fontFamily: 'var(--mono)', whiteSpace: 'pre-wrap', maxHeight: 220, overflowY: 'auto', margin: 0, color: 'var(--text-2)'}}>
          {JSON.stringify(req, null, 2)}
        </pre>
      ) : (
        <div>
          {rows.map(([k, v]) => (
            <div key={k} style={{display: 'flex', fontSize: 12, padding: '2px 0'}}>
              <span style={{width: 110, color: 'var(--text-3)', flexShrink: 0}}>{k}</span>
              <span style={{color: 'var(--text)'}}>{v}</span>
            </div>
          ))}
        </div>
      )}
      <div style={{fontSize: 10.5, color: 'var(--text-3)', marginTop: 6}}>
        This requisition is created automatically in {vmsName} once the API connection is enabled.
      </div>
    </div>
  );
}

function ConfigPage({ config, updateConfig, saveConfig, configDirty, configStatus }) {
  const updateBranding = (k, v) => updateConfig({ branding: {...config.branding, [k]: v} });
  const updateVms = (k, v) => updateConfig({ vms: {...config.vms, [k]: v} });
  const updateWeights = (k, v) => updateConfig({ weights: {...config.weights, [k]: parseInt(v) || 0} });

  return (
    <div className="config-wrap" style={{height: '100%', overflowY: 'auto', padding: '24px 32px', maxWidth: 720}}>
      <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20}}>
        <h2 style={{fontSize: 18, fontWeight: 700}}>Settings</h2>
        <div style={{display: 'flex', gap: 10, alignItems: 'center'}}>
          {configStatus === 'saved' && !configDirty && <span style={{fontSize: 12, color: 'var(--accent)'}}>✓ Saved</span>}
          {configStatus === 'error' && <span style={{fontSize: 12, color: 'var(--red)'}}>Save failed — try again</span>}
          {configDirty && configStatus !== 'saving' && <span style={{fontSize: 12, color: 'var(--text-3)'}}>Unsaved changes</span>}
          <button className="btn btn-primary btn-sm" onClick={() => saveConfig(config)} disabled={!configDirty || configStatus === 'saving'}>
            {configStatus === 'saving' ? 'Saving...' : 'Save settings'}
          </button>
        </div>
      </div>
      <div style={{fontSize: 12, color: 'var(--text-3)', marginBottom: 16, marginTop: -10}}>
        Settings are saved on the server and drive the live routing prompt — knockouts and weights take effect on the next message.
      </div>

      {/* API status */}
      <div className="config-section">
        <div className="config-section-title">AI Chat API</div>
        <div style={{fontSize: 13, color: 'var(--accent)', display: 'flex', alignItems: 'center', gap: 8}}>
          <span style={{width: 8, height: 8, borderRadius: '50%', background: 'var(--accent)', display: 'inline-block'}}></span>
          Connected — API key managed by server
        </div>
      </div>

      {/* Branding */}
      <div className="config-section">
        <div className="config-section-title">Branding</div>
        <div className="config-row">
          <div className="config-label">Client Name</div>
          <input className="input" value={config.client_name} onChange={e => updateConfig({ client_name: e.target.value })} />
        </div>
        <div className="config-row">
          <div className="config-label">Assistant Name</div>
          <input className="input" value={config.assistant_name} onChange={e => updateConfig({ assistant_name: e.target.value })} />
        </div>
        <div className="config-row">
          <div className="config-label">Logo Text</div>
          <input className="input" value={config.branding.logo_text} maxLength={3} style={{width: 80}}
            onChange={e => updateBranding('logo_text', e.target.value)} />
        </div>
        <div className="config-row">
          <div className="config-label">Primary Colour</div>
          <div style={{display: 'flex', gap: 8, alignItems: 'center'}}>
            <input type="color" value={config.branding.primary_color} style={{width: 36, height: 30, border: '1px solid var(--border)', borderRadius: 4, cursor: 'pointer', padding: 2}}
              onChange={e => updateBranding('primary_color', e.target.value)} />
            <input className="input" value={config.branding.primary_color} style={{width: 100, fontFamily: 'var(--mono)', fontSize: 12}}
              onChange={e => updateBranding('primary_color', e.target.value)} />
          </div>
        </div>
        <div className="config-row" style={{alignItems: 'start'}}>
          <div className="config-label" style={{marginTop: 8}}>Greeting</div>
          <textarea className="input" value={config.branding.greeting} rows={2}
            onChange={e => updateBranding('greeting', e.target.value)} />
        </div>
      </div>

      {/* Left Panel */}
      <div className="config-section">

          <div className="config-label" style={{marginTop: 8}}>→ Worksome</div>
          <textarea className="input" rows={2} value={config.knockouts.worksome.join(', ')}

        </div>

      <div className="config-section">
        <div className="config-section-title">Approval Gates</div>

          <div key={i} style={{display: 'flex', gap: 8, marginBottom: 8, alignItems: 'center'}}>

            <input className="input input-sm" value={g.condition}

            <span style={{fontSize: 12, color: 'var(--text-3)', whiteSpace: 'nowrap'}}>→</span>

          </div>
        ))}

          + Add gate
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════
// SVG CHART HELPERS
// ══════════════════════════════════════
function SvgBarChart({ data, barKeys, colors, labels, height = 220 }) {
  const maxVal = Math.max(1, ...data.flatMap(d => barKeys.map(k => d[k])));
  const w = 500, h = height - 40, pad = { top: 10, right: 20, bottom: 30, left: 35 };
  const plotW = w - pad.left - pad.right, plotH = h - pad.top - pad.bottom;
  const groupW = plotW / data.length;
  const barW = Math.min(groupW * 0.35, 28);
  const yTicks = [0, Math.round(maxVal / 2), maxVal];

  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{width: '100%', height: height - 20}}>
        {yTicks.map(t => {
          const y = pad.top + plotH - (t / maxVal) * plotH;
          return <g key={t}><line x1={pad.left} y1={y} x2={w - pad.right} y2={y} stroke="#e2e5ea" strokeDasharray="3 3" /><text x={pad.left - 6} y={y + 4} textAnchor="end" fontSize="11" fill="#9ba3b0">{t}</text></g>;
        })}
        {data.map((d, i) => {
          const cx = pad.left + groupW * i + groupW / 2;
          return (
            <g key={i}>
              <text x={cx} y={h - 6} textAnchor="middle" fontSize="11" fill="#9ba3b0">{d.week}</text>
              {barKeys.map((k, ki) => {
                const bh = (d[k] / maxVal) * plotH;
                const bx = cx - barKeys.length * barW / 2 + ki * (barW + 2);
                return <rect key={k} x={bx} y={pad.top + plotH - bh} width={barW} height={bh} rx="3" fill={colors[ki]} />;
              })}
            </g>
          );
        })}
      </svg>
      <div style={{display: 'flex', gap: 16, justifyContent: 'center'}}>
        {barKeys.map((k, i) => (
          <div key={k} style={{display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: '#5f6776'}}>
            <div style={{width: 10, height: 10, borderRadius: 2, background: colors[i]}} />
            {labels[i]}
          </div>
        ))}
      </div>
    </div>
  );
}

function SvgDonut({ slices, size = 160 }) {
  const total = slices.reduce((a, s) => a + s.value, 0);
  const r = 55, ir = 35, cx = size / 2, cy = size / 2;
  let cum = 0;
  const paths = slices.map((s, i) => {
    const frac = s.value / total;
    const startAngle = cum * 2 * Math.PI - Math.PI / 2;
    cum += frac;
    const endAngle = cum * 2 * Math.PI - Math.PI / 2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const ix1 = cx + ir * Math.cos(endAngle), iy1 = cy + ir * Math.sin(endAngle);
    const ix2 = cx + ir * Math.cos(startAngle), iy2 = cy + ir * Math.sin(startAngle);
    const d = `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${ir} ${ir} 0 ${large} 0 ${ix2} ${iy2} Z`;
    return <path key={i} d={d} fill={s.color} />;
  });

  return (
    <div style={{textAlign: 'center'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>{paths}</svg>
      <div style={{display: 'flex', gap: 16, justifyContent: 'center', marginTop: 8}}>
        {slices.map((s, i) => (
          <div key={i} style={{display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: '#5f6776'}}>
            <div style={{width: 10, height: 10, borderRadius: 2, background: s.color}} />
            {s.label} ({s.value})
          </div>
        ))}
      </div>
    </div>
  );
}

function SvgLineChart({ data, dataKey, height = 180 }) {
  const vals = data.map(d => d[dataKey]);
  const maxVal = Math.max(...vals), minVal = Math.min(...vals);
  const range = maxVal - minVal || 1;
  const w = 500, h = height - 30, pad = { top: 10, right: 20, bottom: 30, left: 35 };
  const plotW = w - pad.left - pad.right, plotH = h - pad.top - pad.bottom;
  const points = data.map((d, i) => ({
    x: pad.left + (i / (data.length - 1)) * plotW,
    y: pad.top + plotH - ((d[dataKey] - minVal) / range) * plotH
  }));
  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const yTicks = [minVal, Math.round((minVal + maxVal) / 2), maxVal];

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{width: '100%', height: height}}>
      {yTicks.map(t => {
        const y = pad.top + plotH - ((t - minVal) / range) * plotH;
        return <g key={t}><line x1={pad.left} y1={y} x2={w - pad.right} y2={y} stroke="#e2e5ea" strokeDasharray="3 3" /><text x={pad.left - 6} y={y + 4} textAnchor="end" fontSize="11" fill="#9ba3b0">{t}</text></g>;
      })}
      {data.map((d, i) => (
        <text key={i} x={points[i].x} y={h - 4} textAnchor="middle" fontSize="11" fill="#9ba3b0">{d.week}</text>
      ))}
      <path d={linePath} fill="none" stroke="#6b3fa0" strokeWidth="2" />
      {points.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="4" fill="#6b3fa0" />)}
    </svg>
  );
}

// ANALYTICS PAGE
// ══════════════════════════════════════
function AnalyticsPage({ config }) {
  const stats = useAnalytics();

  if (!stats) {
    return (
      <div className="analytics-wrap" style={{height: '100%', overflowY: 'auto', padding: '24px 32px'}}>
        <h2 style={{fontSize: 18, fontWeight: 700, marginBottom: 20}}>Analytics</h2>
        <div style={{color: 'var(--text-3)', fontSize: 13}}>Loading…</div>
      </div>
    );
  }

  const hasData = stats.total > 0;

  return (
    <div className="analytics-wrap" style={{height: '100%', overflowY: 'auto', padding: '24px 32px'}}>
      <h2 style={{fontSize: 18, fontWeight: 700, marginBottom: 6}}>Analytics</h2>
      <div style={{fontSize: 12, color: 'var(--text-3)', marginBottom: 20}}>Live data from completed intakes — web portal and Slack.</div>

      {/* Stats row */}
      <div className="stats-grid-4" style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24}}>
        <div className="stat-card">
          <div className="stat-value">{stats.total}</div>
          <div className="stat-label">Total requests</div>
        </div>
        <div className="stat-card">
          <div className="stat-value" style={{color: 'var(--accent)'}}>{stats.worksome}</div>
          <div className="stat-label">→ Worksome</div>
        </div>
        <div className="stat-card">
          <div className="stat-value" style={{color: 'var(--warn)'}}>{stats.vms}</div>
          <div className="stat-label">→ {config.vms.name}</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.avgDurationSeconds ? stats.avgDurationSeconds + 's' : '—'}</div>
          <div className="stat-label">Avg. intake time</div>
        </div>
      </div>

      {!hasData && (
        <div className="stat-card" style={{marginBottom: 24, textAlign: 'center', padding: 48, color: 'var(--text-3)', fontSize: 13}}>
          No intake data yet. Complete a hiring request in the chat (or via Slack) and it will appear here.
        </div>
      )}

      {/* Charts */}
      {hasData && (
        <>
          <div className="charts-grid" style={{display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16, marginBottom: 24}}>
            <div className="stat-card">
              <div style={{fontSize: 13, fontWeight: 600, marginBottom: 16}}>Weekly volume by route</div>
              <SvgBarChart data={stats.weeklyVolume} barKeys={['worksome','vms']} colors={['#6b3fa0','#b45309']} labels={['Worksome', config.vms.name]} />
            </div>
            <div className="stat-card">
              <div style={{fontSize: 13, fontWeight: 600, marginBottom: 16}}>Routing split</div>
              <SvgDonut slices={[{value: stats.worksome, color: '#6b3fa0', label: 'Worksome'}, {value: stats.vms, color: '#b45309', label: config.vms.name}]} />
            </div>
          </div>

          <div className="stat-card" style={{marginBottom: 24}}>
            <div style={{fontSize: 13, fontWeight: 600, marginBottom: 16}}>Avg. intake duration by week (seconds)</div>
            <SvgLineChart data={stats.avgDurationWeekly} dataKey="seconds" />
          </div>
        </>
      )}

      {/* Recent requests table */}
      {hasData && (
        <div className="stat-card">
          <div style={{fontSize: 13, fontWeight: 600, marginBottom: 16}}>Recent requests</div>
          <div className="table-wrap">
          <table className="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Role</th>
                <th>Source</th>
                <th>Route</th>
                <th>Confidence</th>
                <th>Status</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody>
              {stats.recent.map(r => (
                <tr key={r.id}>
                  <td>{r.date}</td>
                  <td style={{fontWeight: 500}}>{r.role}</td>
                  <td>{r.channel === 'slack' ? 'Slack' : 'Web'}</td>
                  <td><span className={`badge ${r.route === 'worksome' ? 'badge-green' : 'badge-orange'}`}>
                    {r.route === 'worksome' ? 'Worksome' : config.vms.name}
                  </span></td>
                  <td><span className={`badge ${r.confidence === 'high' ? 'badge-blue' : 'badge-gray'}`}>{r.confidence}</span></td>
                  <td style={{fontSize: 12, color: 'var(--text-2)'}}>{r.status.replace(/_/g, ' ')}</td>
                  <td style={{fontFamily: 'var(--mono)', fontSize: 12}}>{r.durationSeconds ? r.durationSeconds + 's' : '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        </div>
      )}
    </div>
  );
}
